---
email_case: all
email_dry_run: true
email_operation_timeout_seconds: 0.2
email_context: |
  Environment: TEST
  Stack: WAS ND / BAW
  Cell: TestCell
  Node: Node01
  Profile: AppSrv01
  JVM: server1

# Optional paths must exist on the machine executing Python.
