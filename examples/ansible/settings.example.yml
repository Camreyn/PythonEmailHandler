# email_recipients:
#   - was-operations@example.com
# email_attachments:
#   - /var/tmp/was-health-report.txt

# Optional child-process environment. Supply real values through Ansible Vault
# or an AAP credential injector rather than committing credentials here.
# email_environment:
#   SMTP_PASSWORD: "{{ vault_smtp_password }}"
