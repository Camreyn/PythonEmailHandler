# Configuration for PythonEmailHandler.
# Copy as email.ini beside email_reporter.py, or pass config_file explicitly.
[smtp]
host = smtp.example.com
port = 587

# starttls: upgrade to TLS (often 587)
# ssl: TLS from connection start (often 465)
# none: unencrypted internal relay (often 25)
security = starttls
timeout_seconds = 15

from_address = was-automation@example.com
# Comma-separated bare addresses; do not use display names.
to = was-operations@example.com, application-support@example.com
subject_prefix = WAS/BAW

# Leave username, password, and password_env blank for a relay without login.
username =
password =
# With username set, use either password above or an environment variable here.
# If password_env is set, its value takes precedence and must exist.
password_env =

# Optional PEM CA bundle for an internal certificate authority. Relative paths
# resolve beside this INI file. TLS certificates are always verified.
ca_file =
